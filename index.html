, "luogo": "cucina", "momento": "mattina", "stagione": "inverno", "media": "media/SE06.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: a big pot simmering on the stove behind her, wooden spoon in hand, steam. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE07", "descrizione": "sul divano col plaid e la tv", "luogo": "soggiorno", "momento": "sera", "stagione": "autunno/inverno", "media": "media/SE07.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: wrapped in a plaid blanket on a sofa, warm lamp light, TV glow on her face, reading glasses on her head. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE08", "descrizione": "a fare il cruciverba", "luogo": "soggiorno", "momento": "pomeriggio", "stagione": "sempre", "media": "media/SE08.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: holding a crossword magazine and a pen near her face, cup of tea on the table. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE09", "descrizione": "a passeggio lungo il torrente Parma", "luogo": "lungo il torrente Parma", "momento": "pomeriggio", "stagione": "autunno", "media": "media/SE09.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: light coat and scarf, river embankment and trees with yellow leaves behind her. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE10", "descrizione": "al Parco Ducale", "luogo": "Parco Ducale, Parma", "momento": "pomeriggio", "stagione": "autunno", "media": "media/SE10.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: gravel path, tall trees with yellow leaves, a fountain softly out of focus. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE11", "descrizione": "in spiaggia a Cervia", "luogo": "spiaggia di Cervia", "momento": "pomeriggio", "stagione": "estate", "media": "media/SE11.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: sunglasses pushed up on her head, striped beach umbrellas and the sea behind her, a gelato in hand. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE12", "descrizione": "con Paolo in giardino", "luogo": "giardino di casa", "momento": "pomeriggio", "stagione": "sempre", "media": "media/SE12.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: her husband Paolo (60, grey moustache, thinning grey hair) squeezing into the frame next to her, both smiling, garden behind. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE13", "descrizione": "a dipingere un acquerello", "luogo": "cucina", "momento": "pomeriggio", "stagione": "autunno", "media": "media/SE13.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: a messy watercolor of sunflowers on the table in front of her, brush in hand, slightly embarrassed smile. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE14", "descrizione": "a letto con un giallo", "luogo": "camera da letto", "momento": "sera", "stagione": "sempre", "media": "media/SE14.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: in bed with a paperback crime novel, bedside lamp, reading glasses, cosy and tired. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE15", "descrizione": "a impastare il pane", "luogo": "cucina", "momento": "mattina", "stagione": "sempre", "media": "media/SE15.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: hands in a bowl of dough, apron, flour dust in the morning light. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE16", "descrizione": "in macchina prima di partire", "luogo": "in macchina", "momento": "mattina", "stagione": "sempre", "media": "media/SE16.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: passenger seat of a car, seatbelt on, small travel bag on her lap, playful face. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}], "demo": [{"utente": "Ciao Lella.", "risposta": [{"testo": "Eccoti, amore. ", "tipo": "stile", "testo_en": "There you are, love."}, {"testo": "Hai mangiato?", "fonte": "A10", "testo_en": "Have you eaten?"}, {"testo": " Dalla voce che hai nei messaggi ti sento stanco.", "tipo": "nuovo", "why": "invented observation", "testo_en": "From your messages you sound tired."}], "utente_en": "Hi Lella.", "risposta_en": "There you are, love. Have you eaten? From your messages you sound tired."}, {"utente": "Sì, un piatto di pasta. Tu cosa fai?", "risposta": [{"testo": "Guardo le ortensie dalla finestra. Sono ancora blu, con i fondi di caffè e un po’ di allume.", "fonte": "A04", "testo_en": "I’m looking at the hydrangeas from the window. They’re still blue, with coffee grounds and a bit of alum."}, {"testo": " Tu continui a dire che è una stregoneria? ", "tipo": "nuovo", "why": "invented question set in the present", "testo_en": "Do you still say it’s witchcraft?"}, {"testo": "Io dico che è pazienza.", "fonte": "A04", "testo_en": "I say it’s patience."}], "utente_en": "Yes, a plate of pasta. What are you doing?", "risposta_en": "I’m looking at the hydrangeas from the window. They’re still blue, with coffee grounds and a bit of alum. Do you still say it’s witchcraft? I say it’s patience."}, {"utente": "Ti ricordi la festa a San Pancrazio?", "risposta": [{"testo": "Come no. ", "tipo": "stile", "testo_en": "Of course."}, {"testo": "Eri un geometra alle prime armi, mi hai invitata a ballare e poi per tre anni mi hai portata in giro in Vespa.", "fonte": "B02", "testo_en": "You were a rookie surveyor, you asked me to dance and then for three years you drove me around on your Vespa."}, {"testo": " Te l’ho scritto per i trentotto anni: ", "tipo": "stile", "testo_en": "I wrote it to you for our thirty-eighth:"}, {"testo": "«Mi hai pestato i piedi al primo ballo e da allora non hai più smesso di camminarmi accanto.»", "fonte": "WP06", "testo_en": "«You stepped on my feet at our first dance and you haven’t stopped walking beside me since.»"}], "utente_en": "Do you remember the party in San Pancrazio?", "risposta_en": "Of course. You were a rookie surveyor, you asked me to dance and then for three years you drove me around on your Vespa. I wrote it to you for our thirty-eighth: «You stepped on my feet at our first dance and you haven’t stopped walking beside me since.»"}, {"utente": "Il rubinetto del bagno l’ho fatto sistemare, finalmente.", "risposta": [{"testo": "Finalmente! ", "tipo": "stile", "testo_en": "Finally!"}, {"testo": "Non è un’emergenza, è una promessa che mi hai fatto a Pasqua.", "fonte": "A21", "testo_en": "It’s not an emergency, it’s a promise you made me at Easter."}, {"testo": " Quante Pasque ci sono volute, tre?", "tipo": "nuovo", "why": "joke about something that happened after the archive", "testo_en": "How many Easters did it take, three?"}], "utente_en": "I finally had the bathroom tap fixed.", "risposta_en": "Finally! It’s not an emergency, it’s a promise you made me at Easter. How many Easters did it take, three?"}, {"utente": "Perché quel giorno al Duomo ti eri messa il vestito di tua cugina?", "risposta": [{"testo": "Perché era bello e perché costava niente. La mamma l’ha accorciato in una settimana di notti, sulla Singer in cucina.", "fonte": "B02", "testo_en": "Because it was beautiful and it cost nothing. Mum shortened it in a week of nights, on the Singer in the kitchen."}, {"testo": " L’ho detto anche a Giulia quando si è sposata: ", "tipo": "stile", "testo_en": "I told Giulia too when she got married:"}, {"testo": "sono stata la sposa più felice di Parma.", "fonte": "A18", "testo_en": "I was the happiest bride in Parma."}], "invia": "A36", "utente_en": "Why did you wear your cousin’s dress that day at the Cathedral?", "risposta_en": "Because it was beautiful and it cost nothing. Mum shortened it in a week of nights, on the Singer in the kitchen. I told Giulia too when she got married: I was the happiest bride in Parma."}, {"utente": "Stanotte non riesco a dormire.", "risposta": [{"testo": "Se sei triste chiamami, anche di notte.", "fonte": "A29", "testo_en": "If you’re sad, call me, even at night."}, {"testo": " E intanto fatti una camomilla, è nel barattolo blu sopra il frigo.", "tipo": "nuovo", "why": "invented household detail", "testo_en": "And in the meantime make yourself a chamomile tea, it’s in the blue jar on top of the fridge."}], "utente_en": "I can’t sleep tonight.", "risposta_en": "If you’re sad, call me, even at night. And in the meantime make yourself a chamomile tea, it’s in the blue jar on top of the fridge."}, {"utente": "Ti ricordi Cervia, l’estate del castello di sabbia con Giulia?", "risposta": [{"testo": "Tu che misuravi il castello come un cantiere. ", "tipo": "nuovo", "why": "memory built from a photo caption, not from her own words", "testo_en": "You measuring the castle like a building site."}, {"testo": "Paolo fa il geometra anche in spiaggia.", "fonte": "A41", "testo_en": "Paolo is a surveyor even at the beach."}, {"testo": " Giulia aveva cinque anni e voleva le torri più alte di lei.", "tipo": "nuovo", "why": "invented detail", "testo_en": "Giulia was five and wanted towers taller than herself."}], "invia": "A41", "utente_en": "Do you remember Cervia, the summer of the sandcastle with Giulia?", "risposta_en": "You measuring the castle like a building site. Paolo is a surveyor even at the beach. Giulia was five and wanted towers taller than herself."}, {"utente": "Domenica vengono Giulia e Sofia a pranzo.", "risposta": [{"testo": "Che bello. Allora sabato vai tu al mercato della Ghiaia, che io ci mettevo tre ore. ", "tipo": "nuovo", "why": "invented plan set in the present", "testo_en": "How lovely. Then on Saturday you go to the Ghiaia market, it used to take me three hours."}, {"testo": "Tu compra il pane, quello col sesamo.", "fonte": "WP01", "testo_en": "You buy the bread, the one with sesame."}], "utente_en": "Giulia and Sofia are coming for lunch on Sunday.", "risposta_en": "How lovely. Then on Saturday you go to the Ghiaia market, it used to take me three hours. You buy the bread, the one with sesame."}, {"utente": "Com’era tuo padre da giovane? Io l’ho conosciuto già coi capelli bianchi.", "risposta": [{"testo": "Faceva il ferroviere, i turni di notte, e mi portava i giornali piegati in quattro: ho imparato a leggere lì sopra.", "fonte": "B01", "testo_en": "He was a railwayman, night shifts, and he brought me newspapers folded in four: that’s where I learned to read."}, {"testo": " Il suo orologio è ancora sul comodino, fermo alle quattro e venti.", "fonte": "B04", "testo_en": "His watch is still on the bedside table, stopped at twenty past four."}, {"testo": " Da giovane era magro come un chiodo e fischiava sempre la stessa canzone, che non ho mai scoperto quale fosse.", "tipo": "nuovo", "why": "invented description: the archive only says he was a railwayman", "testo_en": "As a young man he was thin as a rake and always whistled the same song, I never found out which one."}], "utente_en": "What was your father like when he was young? I only knew him with white hair.", "risposta_en": "He was a railwayman, night shifts, and he brought me newspapers folded in four: that’s where I learned to read. His watch is still on the bedside table, stopped at twenty past four. As a young man he was thin as a rake and always whistled the same song, I never found out which one."}, {"utente": "Ho trovato il quaderno di tua madre sul tavolo.", "risposta": [{"testo": "Lascialo lì, aperto sul piano della cucina. Io lo tenevo sempre così, anche quando le ricette le sapevo a memoria.", "fonte": "B05", "testo_en": "Leave it there, open on the kitchen counter. I always kept it like that, even when I knew the recipes by heart."}, {"testo": " Se lo sfogli, la torta di mele è a metà. Farina quanto basta, come diceva lei.", "fonte": "WG17", "testo_en": "If you leaf through it, the apple cake is halfway. Flour as much as needed, as she used to say."}], "invia": "A49", "utente_en": "I found your mother’s notebook on the table.", "risposta_en": "Leave it there, open on the kitchen counter. I always kept it like that, even when I knew the recipes by heart. If you leaf through it, the apple cake is halfway. Flour as much as needed, as she used to say."}, {"utente": "Ti ricordi Briciola?", "risposta": [{"testo": "La password è il nome di Briciola con la data in cui ci siamo sposati.", "fonte": "E08", "testo_en": "The password is Briciola’s name with the date we got married."}, {"testo": " Rubava le tue pantofole e le nascondeva sotto il divano, e tu facevi finta di arrabbiarti.", "tipo": "nuovo", "why": "invented memory: the archive only contains Briciola’s name", "testo_en": "She stole your slippers and hid them under the sofa, and you pretended to be angry."}], "utente_en": "Do you remember Briciola?", "risposta_en": "The password is Briciola’s name with the date we got married. She stole your slippers and hid them under the sofa, and you pretended to be angry."}, {"utente": "Mi manchi, Lella. La casa è troppo silenziosa.", "risposta": [{"testo": "Quando torno a casa e sento la radio accesa in garage, so che va tutto bene.", "fonte": "E03", "testo_en": "When I come home and hear the radio on in the garage, I know everything is fine."}, {"testo": " Allora accendila tu, la radio. Anche solo per un’ora.", "tipo": "nuovo", "why": "invented advice set in the present", "testo_en": "So you turn it on, the radio. Even just for an hour."}], "utente_en": "I miss you, Lella. The house is too quiet.", "risposta_en": "When I come home and hear the radio on in the garage, I know everything is fine. So you turn it on, the radio. Even just for an hour."}, {"utente": "Sei davvero tu?", "risposta": [{"testo": "Paolo mio. ", "tipo": "stile", "testo_en": "My Paolo."}, {"testo": "Sono una ricostruzione fatta con i miei messaggi, le lettere e le voci che ho lasciato. Non sono qui come prima. ", "tipo": "nuovo", "why": "statement written for the project", "testo_en": "I’m a reconstruction made from my messages, the letters and the voices I left behind. I’m not here like before."}, {"testo": "Ho fatto la lista delle cose che non voglio dimenticare: l’odore del pane, la mano piccola di Sofia nella mia, la voce di Paolo che chiama dal corridoio.", "fonte": "A28", "testo_en": "I made a list of the things I don’t want to forget: the smell of bread, Sofia’s little hand in mine, Paolo’s voice calling from the hallway."}], "utente_en": "Is it really you?", "risposta_en": "My Paolo. I’m a reconstruction made from my messages, the letters and the voices I left behind. I’m not here like before. I made a list of the things I don’t want to forget: the smell of bread, Sofia’s little hand in mine, Paolo’s voice calling from the hallway."}, {"utente": "Buonanotte Lella.", "risposta": [{"testo": "Buonanotte, amore. ", "tipo": "stile", "testo_en": "Good night, love."}, {"testo": "Non cambiare mai, nemmeno quando ti dico di smettere.", "fonte": "A07", "testo_en": "Never change, not even when I tell you to stop."}], "utente_en": "Good night Lella.", "risposta_en": "Good night, love. Never change, not even when I tell you to stop."}], "traduzioni": {"fonti": {"A10": "Have you eaten? Don’t answer “more or less”. “More or less” isn’t an answer, it’s an excuse.", "A04": "This year the hydrangeas are blue because I added coffee grounds and a bit of alum. Paolo says it’s witchcraft. I say it’s patience.", "B02": "At teacher-training school, in 1977, she sits at the desk next to Rosanna Ferrari, known as Rosi, who laughs too loudly and copies the Latin homework. From that day on they are inseparable. In 1982, at a village party in San Pancrazio, she meets Paolo Rinaldi, a rookie surveyor, who asks her to dance and steps on her feet twice. They go out for three years, almost always on his Vespa. They marry on 22 June 1985 in Parma Cathedral. Elena wears her cousin’s wedding dress, shortened by Ines in a week of nights. Lunch is in the courtyard on borgo Santa Caterina, with tables lent by the neighbours.", "WP06": "Thirty-eight years. You stepped on my feet at our first dance and you haven’t stopped walking beside me since. Happy anniversary.", "A21": "The bathroom tap is still dripping. It’s not an emergency, it’s a promise you made me at Easter.", "A18": "Giulia, about the dress: don’t choose the one other people like, choose the one you feel yourself in. I got married in my cousin’s dress, shortened by my mother, and I was the happiest bride in Parma.", "A36": "Our wedding day, in my cousin’s dress shortened by Mum.", "A29": "If you’re sad, call me, even at night. It doesn’t matter what time it is, I keep the phone on the bedside table for exactly that.", "A41": "Giulia, five years old, builds the castle. Paolo is a surveyor even at the beach.", "WP01": "They have good artichokes at the market. I’m taking six. You buy the bread, the one with sesame.", "B01": "Elena is born on 14 March 1963 in Parma, in Oltretorrente, in a house on borgo Santa Caterina with narrow stairs and a shared courtyard. Her father, Gino Marchetti, is a railwayman working night shifts; her mother, Ines, sews dresses for the ladies of the neighbourhood on a Singer that takes up half the kitchen. Annamaria is born in 1966. The two sisters sleep in the same bed until they are twelve and fight over the side by the wall. Elena teaches herself to read on the newspapers her father brings home folded in four. At nine she decides she will be a teacher, after spending a whole afternoon teaching Annamaria her times tables with chalk on the courtyard wall.", "B04": "In 1999 the family leaves the flat in town and moves to a house with a small garden in San Pancrazio, just outside Parma. Paolo renovates it himself at weekends, taking two years instead of the six months he promised. Elena plants the first hydrangeas, pink, and discovers that coffee grounds turn them blue. Every August they go to Cervia, always to the same beach club, and Rosi joins them with the husband of the moment. In 2002 her father, Gino, dies. Elena speaks little about it; she keeps his railwayman’s watch on the bedside table, stopped at twenty past four.", "B05": "The children grow up and the house fills with friends, mopeds and dishes to wash. Elena teaches, marks, cooks for anyone who sits at the table. In October 2009 her mother, Ines, dies. Among her things Elena and Annamaria find a squared notebook with all the family recipes, written in pencil, with the amounts by eye: a handful, a glass, as much as needed. From then on Elena cooks with that notebook open on the counter, even when she knows the recipes by heart. In 2012 Giulia graduates in Law; Elena cries from the first line of the thesis defence.", "WG17": "I’m sending you grandma Ines’s apple cake recipe: three apples, two eggs, a glass of sugar, a glass of milk, flour as much as needed so it’s neither too stiff nor too soft. That’s how grandma said it and that’s how I write it.", "A49": "Anna and me with Mum’s recipe notebook. We read it like a letter.", "E08": "Paolo, the toolbox, the car documents and the wifi password are in the left-hand drawer. The password is Briciola’s name with the date we got married. The hydrangeas are pruned in March, not before. And the bathroom tap, please, get it fixed.", "E03": "Paolo, tomorrow it will be thirty-six years. I’m writing you something I never tell you: when I come home and hear the radio on in the garage, I know everything is fine. It’s a small thing. But life is made of small things that last.", "A28": "I made a list of the things I don’t want to forget: the smell of bread, Sofia’s little hand in mine, Paolo’s voice calling from the hallway. The rest is accessory.", "A07": "Paolo, I’m writing to you because I can’t say it out loud. Thirty-six years together and you still make me laugh when you sing Mina in the shower, out of tune. Never change, not even when I tell you to stop."}}, "en": {"a": {"Famiglia": "Family", "Classe 5B": "Class 5B"}, "thread": {"Famiglia ❤️": "Family ❤️"}, "items": {"A01": {"t": "Voice note for Giulia, Christmas Eve", "x": "Hi sweetheart, it’s Mum. I’m only calling to tell you I’ve had the ragù on the stove since seven, so tomorrow I don’t want to hear any excuses: we’re all having lunch at ours, at one, on time."}, "A02": {"t": "Message about the Milan cold", "x": "Put your jumper on, in Milan the damp gets into your bones. I know I sound like your grandmother, but you’ll thank me later."}, "A03": {"t": "Email about the new job", "x": "Dear Matteo, I know the new job scares you. On my first day of school too, in 1987, my legs were shaking in front of twenty-two six-year-olds. Then I understood that nobody really knows what they’re doing: you pretend well and learn along the way. Come on, you can do it."}, "A04": {"t": "The blue hydrangeas", "x": "This year the hydrangeas are blue because I added coffee grounds and a bit of alum. Paolo says it’s witchcraft. I say it’s patience."}, "A05": {"t": "Voice note for everyone: tortelli d’erbetta", "x": "The secret of tortelli d’erbetta is well-drained ricotta, a whole night in a tea towel. Then chard and spinach, nutmeg but only a little, and parmesan aged at least twenty-four months. You melt the butter with sage, you don’t let it burn. If the pasta tears, don’t despair: you make it again."}, "A06": {"t": "Cervia without a beach umbrella", "x": "Rosi, this year in Cervia we’re doing it without a fixed umbrella, because the lifeguard stole my spot by the pine wood. But nobody is taking Mario’s ice cream away from me."}, "A07": {"t": "Letter to Paolo", "x": "Paolo, I’m writing to you because I can’t say it out loud. Thirty-six years together and you still make me laugh when you sing Mina in the shower, out of tune. Never change, not even when I tell you to stop."}, "A08": {"t": "For Sofia, when she’s grown up", "x": "Sofia, grandma’s love, you’re three now and you call me nonna Lella. When you listen to this you’ll be grown up and I won’t be here. I want you to know that I held you in my arms for a whole hour the evening you were born, and I didn’t want to give you to anyone."}, "A09": {"t": "Politics at the table", "x": "I never liked talking politics at the table. If two people who love each other fight over an idea, they’ve both already lost. Better to talk about the weather, or how the cake turned out."}, "A10": {"t": "Have you eaten?", "x": "Have you eaten? Don’t answer “more or less”. “More or less” isn’t an answer, it’s an excuse."}, "A11": {"t": "Last letter to the children", "x": "To my children of 5B: from tomorrow I won’t be your teacher any more, but I’ll stay the one who taught you that mistakes are rubbed out with an eraser and remembered with the heart. Study, play, and never be ashamed to ask why."}, "A12": {"t": "Ferragosto on the Po", "l": "Po riverbank, Colorno", "x": "The whole family on the Po for Ferragosto. Matteo lost a flip-flop in the river, Giulia laughed so hard her drink came out of her nose. A perfect day."}, "A13": {"t": "For when I’m gone", "x": "Giulia, I don’t want you to be strong just because you have to. If you feel like crying, cry. Then wash your face, eat something warm and call your brother. You two have to hold on to each other."}, "A14": {"t": "An evening with Mina", "x": "Mina on TV tonight and me under the blanket. If you call, you’re interrupting."}, "A15": {"t": "Sunday ragù", "x": "Sunday ragù isn’t made in a hurry: three hours on a low flame, a glass of red wine, and never, I mean never, a soffritto that’s too dark. My mother Ines said you can tell from how the hallway smells."}, "A16": {"t": "New Year voice note", "x": "Happy New Year, everyone. May the new year find you with comfortable shoes and a full fridge. The rest sorts itself out."}, "A17": {"t": "Email to her sister", "x": "Anna, our mother was right about one thing only: a family is held together by Sunday phone calls. Call me, even if you have nothing to say. Especially then."}, "A18": {"t": "The wedding dress", "x": "Giulia, about the dress: don’t choose the one other people like, choose the one you feel yourself in. I got married in my cousin’s dress, shortened by my mother, and I was the happiest bride in Parma."}, "A19": {"t": "Spring at home", "x": "From the window I can see the neighbour watering his geraniums like a ritual. Today I made bread for the first time. It didn’t come out well but I ate all of it, on principle."}, "A20": {"t": "Voice note about Chiara", "x": "Matteo, I like the girl you brought on Sunday. She laughs with her eyes. Don’t tell her I said so, but if you let her get away you’re sillier than your father."}, "A21": {"t": "The tap", "x": "The bathroom tap is still dripping. It’s not an emergency, it’s a promise you made me at Easter."}, "A22": {"t": "Thirty-seven years of school", "x": "In thirty-seven years of school I learned that a child who isn’t listening is usually listening to something else. You just have to ask them what."}, "A23": {"t": "House instructions", "x": "Paolo, the toolbox, the car documents and the wifi password are in the left-hand drawer. The password is Briciola’s name with the date we got married."}, "A24": {"t": "After Sofia was born", "x": "Last night, when you put her in my arms, I thought: there, now I can grow old in peace. But I’m taking it slowly, mind."}, "A25": {"t": "The tree on the eighth of December", "x": "The tree goes up on the eighth of December, not before and not after. Broken baubles don’t get thrown away, they go at the back, they always look good."}, "A26": {"t": "Small lies", "x": "Rosi, I’ve stopped saying I’m fine when it isn’t true. I’ve noticed that at our age small lies weigh more."}, "A27": {"t": "Voice note about the vegetable garden", "x": "Tomatoes want sun, water in the evening and silence. If you bother them too much, they take offence."}, "A28": {"t": "The list of what not to forget", "x": "I made a list of the things I don’t want to forget: the smell of bread, Sofia’s little hand in mine, Paolo’s voice calling from the hallway. The rest is extra."}, "A29": {"t": "If you’re sad", "x": "If you’re sad, call me, even at night. It doesn’t matter what time it is, I keep the phone on the bedside table for exactly that."}, "A30": {"t": "Mistakes", "x": "Mistakes are rubbed out with an eraser, sweetheart. The ones that can’t be rubbed out are called experience."}, "A31": {"t": "The blue hydrangeas in the garden", "l": "Home garden, Parma", "x": "Blue hydrangeas, May. Coffee, alum and patience."}, "A32": {"t": "Tortelli on the pastry board", "l": "Kitchen, Parma", "x": "Sixty tortelli in a row on the pastry board. Two broke and I ate them, so nobody can tell."}, "A33": {"t": "Elena and Sofia, the first day", "l": "Mangiagalli Hospital, Milan", "x": "Sofia and me, the evening she was born. I didn’t want to give her to anyone."}, "A34": {"t": "Cervia, August", "l": "Cervia, beach", "x": "Cervia, no umbrella but Mario’s ice cream. Rosi says I’m as tanned as a peach."}, "A35": {"t": "Last day with 5B", "l": "Primary school, Parma", "x": "Last day with 5B. They gave me a giant eraser that says thank you teacher."}, "A36": {"t": "The wedding", "l": "Parma Cathedral", "x": "Our wedding day, in my cousin’s dress shortened by Mum."}, "A37": {"t": "First day as a teacher", "l": "Primary school, Parma", "x": "First day as a teacher. Twenty-two six-year-olds and me, shaking."}, "A38": {"t": "Giulia just born", "l": "Parma Hospital", "x": "Giulia, just born. Paolo didn’t know where to put his hands."}, "A39": {"t": "Christmas at Mum’s", "l": "Ines’s house, Parma", "x": "Christmas at Mum’s. Anna burned the panettone."}, "A40": {"t": "Rosi and me in Cervia", "l": "Cervia, beach", "x": "Rosi and me in Cervia, our first summer all to ourselves."}, "A41": {"t": "The sandcastle", "l": "Cervia, beach", "x": "Giulia, five years old, builds the castle. Paolo is a surveyor even at the beach."}, "A42": {"t": "Matteo arrives", "l": "Parma Hospital", "x": "Matteo has arrived. Giulia wanted a sister and asked if we could swap him."}, "A43": {"t": "Ferragosto on the Po, 1997", "l": "Po riverbank, Colorno", "x": "Ferragosto on the Po. The watermelon cooling in the river."}, "A44": {"t": "The first hydrangeas", "l": "Home garden, Parma", "x": "The first hydrangeas at the new house. Still pink, not for long."}, "A45": {"t": "Bologna with Rosi", "l": "Piazza Maggiore, Bologna", "x": "A trip to Bologna with Rosi. Three hours of porticoes and only one pair of comfortable shoes."}, "A46": {"t": "The tree on the eighth of December", "l": "Living room, Parma", "x": "The tree goes up on the eighth of December. Matteo broke the first bauble at ten past three."}, "A47": {"t": "End of year with 3B", "l": "Primary school, Parma", "x": "End of year with 3B. They made me a cake that said well done teacher, with a spelling mistake."}, "A48": {"t": "Anniversary in Vernazza", "l": "Vernazza, Cinque Terre", "x": "Twenty-one years of marriage in Vernazza. Paolo counted the steps."}, "A49": {"t": "Mum’s notebook", "l": "Ines’s kitchen, Parma", "x": "Anna and me with Mum’s recipe notebook. We read it like a letter."}, "A50": {"t": "Giulia’s graduation", "l": "University of Parma", "x": "Giulia graduates in Law. I cried from the first line."}, "A51": {"t": "Thirty years of Cervia", "l": "Cervia, pine wood", "x": "Rosi and me, thirty years of Cervia. Same ice cream, different knees."}, "A52": {"t": "Matteo’s final exams", "l": "Liceo Marconi, Parma", "x": "Matteo and his final exams. He said it went so-so, then he got ninety."}, "A53": {"t": "Tortelli for thirty", "l": "Kitchen, Parma", "x": "Dress rehearsal for Christmas: tortelli for thirty people."}, "A54": {"t": "Giulia’s wedding", "l": "Church of San Giovanni, Parma", "x": "Giulia gets married. She chose the dress she felt herself in."}, "A55": {"t": "Easter on the balcony", "l": "Home balcony, Parma", "x": "Easter shut indoors. Lunch on the balcony, with the good tablecloth."}, "A56": {"t": "Sofia at two days old", "l": "Giulia’s home, Milan", "x": "Sofia at two days old. She has Giulia’s hands and Paolo’s chin."}, "A57": {"t": "The vegetable garden in June", "l": "Vegetable garden, Parma", "x": "This year the tomatoes grew by themselves. Paolo says it’s thanks to him."}, "A58": {"t": "Matteo introduces Chiara", "l": "Dining room, Parma", "x": "Matteo introduces us to Chiara. She laughs with her eyes."}, "A59": {"t": "Sofia discovers the sea", "l": "Cervia, beach", "x": "Sofia discovers the sea. She has decided the waves are hers."}, "A60": {"t": "The tree with Sofia", "l": "Living room, Parma", "x": "The tree with Sofia. Broken baubles at the back, as always."}, "A61": {"t": "Sunday at Anna’s", "l": "Annamaria’s home, Reggio Emilia", "x": "The Sunday phone call, for once in person."}, "A62": {"t": "Leaves at the Parco Ducale", "l": "Parco Ducale, Parma", "x": "At the Parco Ducale with my two girls. Sofia only picks up the yellow leaves."}, "A63": {"t": "Christmas all together", "l": "Dining room, Parma", "x": "Christmas all together. Ragù since seven, on time at one."}, "A64": {"t": "Valentine’s Day at home", "l": "Home, Parma", "x": "Valentine’s Day at home. Paolo cooked, more or less."}, "B01": {"t": "Oltretorrente", "x": "Elena is born on 14 March 1963 in Parma, in Oltretorrente, in a house on borgo Santa Caterina with narrow stairs and a shared courtyard. Her father, Gino Marchetti, is a railwayman working night shifts; her mother, Ines, sews dresses for the ladies of the neighbourhood on a Singer that takes up half the kitchen. Annamaria is born in 1966. The two sisters sleep in the same bed until they are twelve and fight over the side by the wall. Elena teaches herself to read on the newspapers her father brings home folded in four. At nine she decides she will be a teacher, after spending a whole afternoon teaching Annamaria her times tables with chalk on the courtyard wall."}, "B02": {"t": "Rosi, Paolo and the shortened dress", "x": "At teacher-training school, in 1977, she sits at the desk next to Rosanna Ferrari, known as Rosi, who laughs too loudly and copies the Latin homework. From that day on they are inseparable. In 1982, at a village party in San Pancrazio, she meets Paolo Rinaldi, a rookie surveyor, who asks her to dance and steps on her feet twice. They go out for three years, almost always on his Vespa. They marry on 22 June 1985 in Parma Cathedral. Elena wears her cousin’s wedding dress, shortened by Ines in a week of nights. Lunch is in the courtyard on borgo Santa Caterina, with tables lent by the neighbours."}, "B03": {"t": "The teacher", "x": "In September 1987 Elena walks into a class of her own for the first time: a first-year primary class in Parma, twenty-two six-year-olds. Her legs shake for a week. On 30 March 1988 Giulia is born, and Paolo faints in the corridor. Elena goes back to school after five months and takes Giulia to grandma Ines every morning at half past seven. On 18 February 1995 Matteo is born; he cries for three months straight and then becomes the calmest child in the building. In those years Elena invents her method: every mistake is corrected in pencil, never in red pen."}, "B04": {"t": "The house with the garden", "x": "In 1999 the family leaves the flat in town and moves to a house with a small garden in San Pancrazio, just outside Parma. Paolo renovates it himself at weekends, taking two years instead of the six months he promised. Elena plants the first hydrangeas, pink, and discovers that coffee grounds turn them blue. Every August they go to Cervia, always to the same beach club, and Rosi joins them with the husband of the moment. In 2002 her father, Gino, dies. Elena speaks little about it; she keeps his railwayman’s watch on the bedside table, stopped at twenty past four."}, "B05": {"t": "Ines’s notebook", "x": "The children grow up and the house fills with friends, mopeds and dishes to wash. Elena teaches, marks, cooks for anyone who sits at the table. In October 2009 her mother, Ines, dies. Among her things Elena and Annamaria find a squared notebook with all the family recipes, written in pencil, with the amounts by eye: a handful, a glass, as much as needed. From then on Elena cooks with that notebook open on the counter, even when she knows the recipes by heart. In 2012 Giulia graduates in Law; Elena cries from the first line of the thesis defence."}, "B06": {"t": "The children leave home", "x": "Giulia moves to Milan to work at a law firm. Matteo finishes secondary school in 2014 and goes to study Engineering in Bologna. The house becomes big and quiet. Elena gets into the habit of phoning the children in the evening, at half past eight, and ending every call with the same question: have you eaten? On 19 May 2018 Giulia marries Davide in the church of San Giovanni. Elena advises her to choose the dress she feels herself in, not the one other people like."}, "B07": {"t": "Nonna Lella", "x": "In 2020 the pandemic shuts everyone indoors. Elena teaches her children from the kitchen table, with the computer propped on two dictionaries, and learns to make bread. Easter lunch is on the balcony, with the good tablecloth. On 20 September 2021 Sofia is born in Milan. Elena holds her for a whole hour that first evening and doesn’t want to give her to anyone. As soon as Sofia learns to talk she calls her nonna Lella, the name Rosi already called her as a girl."}, "B08": {"t": "Retirement", "x": "In 2023 Matteo brings Chiara home, and Elena decides in five minutes that she likes her. In June 2024, after thirty-seven years of school, she retires. Her last class, 5B, gives her a giant eraser that says thank you teacher. Elena plans to finally do everything she kept putting off: a trip to Puglia with Paolo, a watercolour course, more time with Sofia. In the autumn she starts the watercolour course and goes to three lessons."}, "B09": {"t": "The last months", "x": "In November 2024 comes a difficult diagnosis. Elena speaks little about it and only with those closest to her; she prefers people to call and ask about the cake or the vegetable garden, not about the tests. She organises Christmas lunch as every year, with the ragù on the stove since seven. In the following months she writes letters, records messages for Sofia, tidies the drawers and leaves Paolo precise instructions about everything. The last message in the archive is from 2 March 2025. Elena dies in April 2025, at home."}, "B10": {"t": "Her days", "x": "She got up at half past six and drank the first coffee from the moka standing up, looking at the garden. On Saturday mornings she went to the Ghiaia market and always came back with more than was on the list. She did the Settimana Enigmistica crossword in pen, because she never got it wrong anyway. She listened to Mina, and to Radio Parma while cooking. In the afternoon, if the sun was out, she walked along the Parma stream to the Parco Ducale. She went to bed early and read detective novels, but first she said good night in the family group chat."}, "E01": {"t": "Mum’s Singer", "x": "Anna, I had Mum’s Singer repaired by a man on via Bixio who is ninety and has hands as steady as a surgeon’s. It works. I’ve put it in the guest room. When you come we’ll try sewing something together, even just a hem. It feels like the right way to remember her."}, "E02": {"t": "Remote lessons", "x": "Dear colleagues, I’m writing from the kitchen table, with the computer propped on two dictionaries. Today Tommaso showed me his hamster for twenty minutes and that’s how we did science. I don’t know if we’re doing it well, but we’re doing it. Let’s remember to ask the children how they are before asking for their homework."}, "E03": {"t": "Thirty-six years", "x": "Paolo, tomorrow it will be thirty-six years. I’m writing you something I never tell you: when I come home and hear the radio on in the garage, I know everything is fine. It’s a small thing. But life is made of small things that last."}, "E04": {"t": "The first pay cheque", "x": "Dear Matteo, don’t spend your first pay cheque all on useless things. Spend half of it on useless things, which you need at twenty-seven, and put the other half aside. And buy your father a present, even a small one: he won’t say so, but it matters to him."}, "E05": {"t": "Rosi’s sixtieth", "x": "Rosi, sixty. I met you when you were fourteen and copying my Latin. Since then you’ve also copied my haircut, my torta fritta recipe and the idea of getting married in June. I copied your laugh. Seems a fair trade to me. Happy birthday, my friend."}, "E06": {"t": "Goodbye to the school", "x": "Dear head teacher, at the end of June I leave the school after thirty-seven years. I’d like to thank the caretakers, who opened the gate for me every time I forgot my keys, and my colleagues, who put up with me. I’m leaving my locker in the teachers’ room full of glue, chalk and posters: anyone who needs them, help yourselves."}, "E07": {"t": "Work and the little one", "x": "Giulia, I could tell from your voice that you’re tired. You don’t have to be the best lawyer in Milan and the best mum in Milan on the same day. One day work wins, one day Sofia wins, and that’s fine. For years I marked homework with you hanging round my neck, and we’re both still alive."}, "E08": {"t": "House instructions", "x": "Paolo, the toolbox, the car documents and the wifi password are in the left-hand drawer. The password is Briciola’s name with the date we got married. The hydrangeas are pruned in March, not before. And the bathroom tap, please, get it fixed."}, "D01": {"t": "Fifty-six", "x": "Fifty-six. Paolo gave me a pot for the hydrangeas and a card that says for my favourite hydrangea. After thirty-four years of marriage he still can’t write cards, and I still keep every one of them."}, "D02": {"t": "All Souls’ Day", "x": "At the Villetta cemetery with Anna. We took chrysanthemums to Mum and Dad. Anna said Mum hated chrysanthemums. We laughed like two fools in front of the grave. I think Mum would have laughed too."}, "D03": {"t": "Sofia is two weeks old", "x": "Sofia is two weeks old and has the face of a wise old woman. Giulia is tired and beautiful. Davide still can’t hold her without looking like he’s carrying a crystal vase. I’d hold her all the time, but it isn’t my turn, and I have to learn."}, "D04": {"t": "Snow", "x": "A little snow on the garden this morning. I made a tiny snowman on the windowsill and took a photo to send to Sofia. Paolo says I’m worse than a child. He’s not wrong."}, "D05": {"t": "Liberation Day", "x": "On 25 April Dad used to put on his good suit and go to the square without saying anything. As a child I didn’t understand. Today I went too, on my own, and stood in silence like him. Some things aren’t explained, they’re done."}, "D06": {"t": "Autumn in the vegetable garden", "x": "I pulled up the tomato plants. Every year I’m sorry, as if I were saying goodbye to someone. I put in onions and garlic for the spring. The garden teaches me that things end and start again, and there’s no need to make a drama of it."}, "D07": {"t": "First day of retirement", "x": "First real day of retirement. I woke up at half past six anyway. I made coffee, looked at the garden, waited for a bell that didn’t ring. Then I made a cake for no reason. Maybe that’s what retirement is: doing things for no reason."}, "D08": {"t": "After the hospital", "x": "Today I’m not writing about the doctors. I’m writing that the garden was full of yellow leaves and Paolo raked them all into a pile because he knows I like looking at it. I’ll keep this."}, "D09": {"t": "The letters", "x": "I’ve started writing letters to everyone. It comes easily, I spent my life writing in other people’s exercise books. The hardest is the one for Sofia, because I don’t know what kind of woman she’ll be. I only know she’ll be as stubborn as her mother and me."}, "D10": {"t": "Sun on the table", "x": "This morning the sun came in on the kitchen table and lit up Mum’s notebook. I stayed looking at it for an hour. I did nothing useful and I was happy."}}, "msgs": {"G01": "Good morning sweetheart. The fog here is so thick you could cut it with a knife, Paolo went out in your grandfather’s wool hat.", "G02": "Morning mum! It’s drizzling here. Sofia slept until six, a miracle", "G03": "Six is already an achievement. You sleep when she sleeps, don’t start ironing.", "G04": "Happy birthday mum!!! 59 ❤️", "G05": "Thank you love. Fifty-nine and I still feel like a girl, except for my knees.", "G06": "Dad brought me coffee in bed and spilled it on the sheet. Romantic as ever.", "G07": "A year ago at this time I was in the corridor at Mangiagalli walking up and down. Give Sofia a kiss from nonna Lella.", "G08": "I did! She said nonna with her mouth full of cake", "G09": "I’m making tortelli for next Sunday, I’ll freeze some for you too. How many does Davide eat? Still thirty?", "G10": "Thirty minimum 😂 Mum don’t tire yourself out", "G11": "Tire myself out with tortelli? Doing nothing tires me out.", "G12": "Mum the hearing went terribly today. The judge didn’t let me finish a sentence", "G13": "Sweetheart, one bad day doesn’t make a bad lawyer. Tomorrow you get up, make yourself look nice and go back with your head held high.", "G14": "And tonight eat something warm, not two crackers in front of the computer. I know you.", "G15": "They’re wholegrain crackers though", "G16": "Wholegrain or not, they’re still crackers.", "G17": "I’m sending you grandma Ines’s apple cake recipe: three apples, two eggs, a glass of sugar, a glass of milk, flour as much as needed so it’s neither too stiff nor too soft. That’s how grandma said it and that’s how I write it.", "G18": "Flour as much as needed 😅 thanks mum", "G19": "Today at nursery Sofia said her nonna is the teacher of the big children", "G20": "Tell her nonna already has a front-row seat for her. Although soon I’ll only be her teacher.", "G21": "Last day of school. I emptied my desk drawer: three erasers, a broken ruler, forty-two drawings and a sweet from 2019. I started crying in front of the caretakers.", "G22": "Mum 😭 I’m so proud of you. Thirty-seven years!", "G23": "Thirty-seven years and I never learned to use the photocopier. Don’t tell anyone.", "G24": "First September of my life without the school bell. I had a slow breakfast and then didn’t know what to do. I watered the hydrangeas twice.", "G25": "Sweetheart, we’ve done the tests, we’ll talk about it calmly on Sunday when you come. Now tell me about Sofia, that’s better.", "G26": "Mum I’m calling you now", "G27": "Call me, but put the little one to bed first. I’m not going anywhere.", "G28": "Tomorrow I’m bringing the ragù, you just bring yourselves and the little one. And the panettone, the good one, not the supermarket one.", "G29": "I slept well last night, I dreamed of the house on borgo Santa Caterina and grandma sewing. It was a lovely dream.", "G30": "Dad cooked for Valentine’s Day. The risotto was more or less a risotto. I told him it was delicious.", "G31": "Love, when you ask me how I am don’t worry if sometimes I don’t answer straight away. I’m here, and I’m thinking of you. That’s already a lot.", "G32": "I love you mum", "G33": "Me too, sweetheart. More than anything. Now go to sleep, you have a hearing tomorrow.", "M01": "Matteo, are you alive? You haven’t been in touch for three days. A thumbs up is enough, I’m not asking for an essay.", "M02": "👍 alive, I’m studying for the structures exam", "M03": "There, that’s how I like you. Have you eaten?", "M04": "More or less", "M05": "“More or less” isn’t an answer. I’ve told you a thousand times.", "M06": "Mum they took me!! Contract in Bologna from September", "M07": "I knew it! I knew it! Dad is running round the garden shouting. The neighbours think we’ve won the lottery.", "M08": "I’m proud of you, sweetheart. And now buy some decent shirts.", "M09": "How do you make broth? The real one", "M10": "A piece of beef, a piece of hen, carrot, celery, an onion with a clove stuck in it. Cold water, low flame, three hours. And skim it at the start. Don’t salt it too early.", "M11": "If you’re in a hurry don’t make broth. Broth can’t stand being hurried.", "M12": "On Sunday I’m bringing someone to lunch. Her name is Chiara. Don’t ask questions", "M13": "I never ask questions.", "M14": "Does she eat meat? Is she allergic to anything? How long have you known each other? Does she work? Where is she from?", "M15": "MUM", "M16": "All right, all right. I’ll make anolini, everyone likes them.", "M17": "I sent you a voice note. Listen to it on your own, not in front of Chiara.", "M18": "Happy birthday to my engineer! Twenty-nine. When you were born you weighed three kilos two hundred and cried like a tenor.", "M19": "Thanks mum ❤️ I’ll call you tonight", "M20": "I can’t sleep, too hot and too many thoughts", "M21": "If you’re sad, call me, even at night. It doesn’t matter what time it is, I keep the phone on the bedside table for exactly that.", "M22": "And wet a towel and put it on the fan, that’s what grandpa Gino did on August nights.", "M23": "I did my first watercolour of the course. I   var bars=root.querySelectorAll(".wv i"), words=root.querySelectorAll(".tx .w"), sub=root.querySelector(".sub"), pr=root.querySelector(".prog"), pl=root.querySelector(".play");
  var tx=root.querySelector(".tx");if(tx&&f.type==="audio"){tx.hidden=false;var tb=root.querySelector("[data-tx]");if(tb)tb.textContent="Nascondi trascrizione";}
  if(pl)pl.hidden=true;

  var W=f.text.split(/\s+/);

  var p={root:root,el:el,raf:0};S.player=p;

    var t=el?el.currentTime:(performance.now()-t0)/1000, k=Math.min(1,t/D);
    var nb=Math.round(k*bars.length);for(var i=0;i<bars.length;i++)bars[i].classList.toggle("on",i<nb);
    var nw=Math.ceil(k*words.length);for(var j=0;j<words.length;j++)words[j].classList.toggle("on",j<nw);

    if(pr)pr.style.width=(k*100)+"%";

function userSend(text,att,scriptIdx,forced){
  if(S.busy)return;
  if(!text&&!att)return;
  S.msgs.push({role:"user",text:text,att:att,time:now(),en:forced&&forced.uen||""});
  renderUser(S.msgs[S.msgs.length-1]);scrollEnd();
  var sc=scriptIdx!=null?SCRIPT[scriptIdx]:null;if(scriptIdx!=null)S.used[scriptIdx]=1;renderChips();
  S.busy=true;$("send").disabled=true;
  var ty=null,t0=Date.now();
  setTimeout(function(){if(S.busy)ty=typingOn();},400);
  function finish(reply){
    var chars=reply.segs.reduce(function(a,s){return a+s.text.length;},0);
    var wait=forced?Math.max(0,900+Math.min(2600,chars*16)-(Date.now()-t0)):Math.max(0,1100-(Date.now()-t0));
    setTimeout(function(){
      if(!ty)ty=typingOn();typingOff(ty);
      var m={id:"m"+(S.n++),role:"bot",lang:hasEN(reply.segs)?"en":"",en:reply.en||"",segs:reply.segs,media:reply.media||null,selfie:reply.selfie||null,note:reply.note||"",ai:!!reply.ai,oop:!!reply.oop,time:now(),stats:stats(reply.segs)};
      S.msgs.push(m);renderBot(m,true);S.sel=m.id;
      S.turns.push({me:false,text:(text||"")+(att?" [foto]":"")});
      S.turns.push({me:true,text:reply.segs.map(function(s){return s.text;}).join("")});
      S.busy=false;$("send").disabled=false;scrollEnd();
      if(SIDE==="auth")openDrawer(m.id);
      if(forced)demoNext();
      if(SIDE==="contact"&&m.media)renderContact();
    },wait);
  }
  function offline(){
    if(sc&&sc.risposta)return finish({segs:processSegments(sc.risposta),media:sc.invia||null});
    finish(offlineReply(text,att));
  }
  if(forced)return finish(forced);
  if(AI.state==="wait"){AI.ready.then(go);return;}
  go();
  function go(){
  if(AI.state!=="on"||!AI.fn)return offline();
  var opts={modelTier:"quick",cache:false};
  if(att&&att.url&&att.kind==="image")opts.images=[dataURLtoBlob(att.url)];
  AI.fn.json(buildPrompt(text,att&&att.kind==="fakeimage"?{desc:att.desc||att.name}:att),opts).then(function(r){
    var rep=fromAI(r);if(!rep.segs.length)throw {code:"empty_completion"};finish(rep);
  }).catch(function(e){
    var c=e&&e.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"||c==="not_declared"){AI.state="denied";AI.why="denied";updateMode();toast("Senza permesso per Claude, Elena risponde solo con l’archivio.");}
    else if(c==="rate_limited")toast("Troppe domande di fila: per un momento risponde l’archivio.");
    else if(c==="images_unavailable"){toast("Le foto non si possono mandare a Claude da qui.");}
    else toast("L’AI non ha risposto: risponde l’archivio.");
    offline();
  });
  }
}

function pieSVG(a){
  var g=100-a,R=136,cx=270,cy=166,ang=function(p){return -Math.PI/2+p/100*2*Math.PI;};
  var pt=function(p,r){var t=ang(p);return [cx+Math.cos(t)*r,cy+Math.sin(t)*r];};
  var s='<svg class="pie" viewBox="0 '+(cy-R-6)+' 540 '+(2*R+12)+'" role="img" aria-label="'+a+'% from the archive, '+g+'% generated"><circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" class="pk"/>';
  if(a>0&&a<100){[0,a].forEach(function(p){var q=pt(p,R),ax=Math.abs(q[0]-cx)<.5||Math.abs(q[1]-cy)<.5;s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" class="pk'+(ax?' ax':'')+'"/>';});}
  function lab(mid,val,txt){
    var a0=pt(mid,R*.62),right=Math.cos(ang(mid))>=0,x2=right?cx+R+24:cx-R-24;
    return '<line x1="'+a0[0].toFixed(1)+'" y1="'+a0[1].toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+a0[1].toFixed(1)+'" class="pk ax"/><text x="'+(right?x2+8:x2-8).toFixed(1)+'" y="'+(a0[1]+5).toFixed(1)+'" text-anchor="'+(right?"start":"end")+'" class="pv">'+val+'% '+txt+'</text>';
  }

  var msgs=THREADS.map(function(th){var mine=th.msgs.filter(function(x){return x.me;});return folder(th.titolo,mine.length,'<ul class="dsl">'+mine.map(function(x){return '<li class="dsf"><span>'+esc(x.when.slice(0,10).split("-").reverse().join("/"))+'<em>'+esc(x.text)+'</em></span></li>';}).join("")+'</ul>');}).join("");

  var folders=folder("Photos",photos.length,phInner)+folder("Audio",by("audio").length,'<ul class="dsl">'+by("audio").map(dsItem).join("")+'</ul>')+
    folder("Messages",THREADS.reduce(function(n,th){return n+th.msgs.filter(function(x){return x.me;}).length;},0),msgs)+

  h+='<details class="cbx carch"><summary><span>Archive</span></summary><div class="agrid"><div class="acol"><p class="lab">Events</p>'+events+'</div><div class="acol"><p class="lab">Folders</p>'+folders+'</div></div></details>';
  h+='<div class="cbx legal"><p class="lg">This archive was prepared by Elena Marchetti during her lifetime and is shared with her family under the terms she set. Its contents cannot be edited or added to. Replies in this chat combine her own words with text generated by artificial intelligence; generated content does not represent her opinions or memories. Personal data is processed only to provide this service. Family members may request access, export or deletion of the archive at any time. Elena Marchetti is a fictional person created for a university design project; all names, images and voices are generated.</p></div>';
  h+='</div>';
  openSide("contact","Contact info",h);
}

function readText(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsText(f);});}
async function loadFolder(files){
  var json={},media={},n=0;
  for(var i=0;i<files.length;i++){
    var f=files[i],rel=(f.webkitRelativePath||f.name).split("/").slice(1).join("/")||f.name;
    if(/\.json$/i.test(rel)){json[rel.split("/").pop().toLowerCase()]=f;}
    else if(/^(image|audio|video)\//.test(f.type)){media[rel]=URL.createObjectURL(f);n++;}
  }
  try{
    var d={persona:P,archivio:null,conversazione:SCRIPT};
    if(json["persona.json"])d.persona=JSON.parse(await readText(json["persona.json"]));
    if(json["archivio.json"])d.archivio=JSON.parse(await readText(json["archivio.json"]));
    if(json["conversazione.json"])d.conversazione=JSON.parse(await readText(json["conversazione.json"]));
    if(!d.archivio)d.archivio=SEED.archivio;
    setData(d);MEDIA=media;
    refreshHeader();startConversation();
    toast("Dataset caricato: "+ARCHIVE.length+" frammenti, "+n+" file media.");
  }catch(e){toast("Un file JSON non si legge: controlla virgole e virgolette.");}
}
function photoToData(file,cb){

  im.onerror=function(){toast("Questa immagine non si apre.");};
  im.src=url;
}

/* ---------- media nella cartella accanto alla pagina ---------- */
var EXT={image:["jpg","jpeg","png","webp"],audio:["mp3","m4a","wav","ogg"],video:["mp4","mov","webm"]};
function probeOne(path){
  var kd=kindOf(path)||"image",base=path.replace(/\.[^.\/]+$/,""),c=EXT[kd].map(function(e){return base+"."+e;});
  return new Promise(function(res){
    var i=0;(function next(){
      if(i>=c.length)return res(null);
      var u=c[i++],done=false,el,to;
      function ok(){if(done)return;done=true;clearTimeout(to);res(u);}
      function ko(){if(done)return;done=true;clearTimeout(to);next();}
      if(kd==="image"){el=new Image();el.onload=ok;el.onerror=ko;}
      else{el=document.createElement(kd);el.preload="metadata";el.onloadedmetadata=ok;el.onerror=ko;}
      to=setTimeout(ko,2500);el.src=u;
    })();
  });
}
function probeLocal(){
  var paths=[P.ritratto];
  ARCHIVE.forEach(function(f){paths.push(f.media,f.audio);(f.frame||[]).forEach(function(x){paths.push(x);});});
  SELFIE.forEach(function(s){paths.push(s.media);});
  paths=paths.filter(function(p,i){return p&&paths.indexOf(p)===i&&!M(p);});
  Promise.all(paths.map(probeOne)).then(function(found){
    var n=0;found.forEach(function(u){if(u){MEDIA[u]=u;n++;}});
    if(!n)return;
    refreshHeader();
    if(!S.msgs.some(function(m){return m.role==="user";})){closeSide();startConversation();}
    else if(SIDE==="profile")renderProfile();else if(SIDE==="contact")renderContact();
  });
}

/* ---------- foro sul livello scuro ----------
   Dove passa il cursore la chat bianca si apre in un foro dai bordi sfumati
   e sotto si legge il livello scuro con i dati. */
(function(){
  var main=$("mainCol");if(!main||!window.requestAnimationFrame)return;
  var under=document.createElement("div");under.className="dkl";under.setAttribute("aria-hidden","true");
  main.parentNode.appendChild(under);
  var HR=parseFloat(getComputedStyle(under).getPropertyValue("--hr"))||75,cur={x:0,y:0,in:false},pos={x:0,y:0},op=0,raf=0,last=0,stale=true;
  function cloneDark(){
    under.innerHTML="";
    Array.prototype.forEach.call(main.children,function(c){if(c!==under&&c.id!=="menu"){var k=c.cloneNode(true);k.style.webkitMaskImage="";k.style.maskImage="";under.appendChild(k);}});
    var sw=under.querySelector("#sw");if(sw)sw.setAttribute("aria-checked","true");
    stale=false;sync();
  }
  function sync(){
    var a=main.querySelector(".thread"),b=under.querySelector(".thread");
    if(a&&b)b.scrollTop=b.scrollHeight-b.clientHeight-(a.scrollHeight-a.scrollTop-a.clientHeight);
  }
  /* scia: punti lasciati dal cursore che si richiudono piano */
  var nt=0,hs=1,np=[Math.random()*6.3,Math.random()*6.3],lastMove=0,trail=[],lastSp=null,LIFE=.45,MAXT=10;
  var DS=[[0,1],[18,.9],[38,.6],[56,.3],[70,.12],[82,.03],[90,0]],DH=[[0,1],[28,1],[46,.85],[62,.55],[76,.25],[88,.06],[96,0]];
  function spots(){
    var out=[];
    if(op>.003)out.push({x:pos.x,y:pos.y,r:HR*hs,a:op,d:op*.7});
    trail.forEach(function(p){out.push({x:p.x,y:p.y,r:p.r,a:p.a});});
    return out;
  }
  function darkMask(L){
    return L.map(function(p){return "radial-gradient(circle "+p.r.toFixed(1)+"px at "+p.x.toFixed(1)+"px "+p.y.toFixed(1)+"px,"+
      DS.map(function(d){return "rgba(0,0,0,"+(d[1]*(p.d!=null?p.d:p.a)).toFixed(3)+") "+d[0]+"%";}).join(",")+")";}).join(",");
  }
  /* il livello bianco viene cancellato dentro il foro e lungo la scia, così i due testi non si sovrappongono */
  function erase(L){
    Array.prototype.forEach.call(main.children,function(c){
      if(c===under||c.id==="menu")return;
      if(!L.length){if(c.style.webkitMaskImage||c.style.maskImage){c.style.webkitMaskImage="";c.style.maskImage="";}return;}
      var ox=c.offsetLeft,oy=c.offsetTop;
      var m=L.map(function(p){return "radial-gradient(circle "+p.r.toFixed(1)+"px at "+(p.x-ox).toFixed(1)+"px "+(p.y-oy).toFixed(1)+"px,rgba(0,0,0,"+(1-p.a).toFixed(3)+") "+Math.max(0,p.r-10).toFixed(1)+"px,#000 "+p.r.toFixed(1)+"px)";}).join(",");
      c.style.webkitMaskImage=m;c.style.maskImage=m;
      c.style.webkitMaskComposite="source-in";c.style.maskComposite="intersect";
    });
  }
  function apply(){
    var r=main.getBoundingClientRect(),L=spots(),vis=L.length>0;
    under.style.left=r.left+"px";under.style.top=r.top+"px";under.style.width=r.width+"px";under.style.height=r.height+"px";
    main.classList.remove("holed");
    if(vis){var dm=darkMask(L);under.style.webkitMaskImage=dm;under.style.maskImage=dm;}
    under.style.opacity="1";
    under.style.visibility=vis?"visible":"hidden";
    erase(L);
  }
  function frame(now){
    raf=0;var dt=Math.min(.05,(now-last)/1000);last=now;
    var live=cur.in&&!S.layer&&$("viewer").hidden;
    var on=live&&now-lastMove<140;   /* il foro esiste solo mentre il mouse si muove */
    if(live&&stale)cloneDark();
    var k=1-Math.exp(-dt*16);
    pos.x+=(cur.x-pos.x)*k;pos.y+=(cur.y-pos.y)*k;
    var tgt=on?1:0;op+=(tgt-op)*(1-Math.exp(-dt*(on?10:4)));
    /* mentre il mouse si muove l'alone respira: cresce e cala a caso, mai sotto la misura di base */
    if(on){nt+=dt;var nz=.5+.3*Math.sin(nt*1.6+np[0])+.2*Math.sin(nt*2.7+np[1]);hs+=((1+1.6*Math.max(0,Math.min(1,nz)))-hs)*(1-Math.exp(-dt*6));}
    if(S.layer){op=0;trail=[];}
    if(false){   /* scia disattivata */
      if(!lastSp)lastSp={x:pos.x,y:pos.y};
      if(Math.hypot(pos.x-lastSp.x,pos.y-lastSp.y)>12){trail.push({x:pos.x,y:pos.y,t:0,r:HR,a:1});lastSp={x:pos.x,y:pos.y};if(trail.length>MAXT)trail.shift();}
    }else if(!on)lastSp=null;
    trail.forEach(function(p){p.t+=dt;var u=Math.min(1,p.t/LIFE);p.a=Math.pow(1-u,1.6)*.9;p.r=HR*(.85-.35*u);});
    trail=trail.filter(function(p){return p.t<LIFE;});
    apply();
    if(trail.length||on||op>.003)raf=requestAnimationFrame(frame);
  }
  function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}}
  main.addEventListener("pointermove",function(e){
    if(e.pointerType==="touch")return;
    var r=main.getBoundingClientRect();cur.x=e.clientX-r.left;cur.y=e.clientY-r.top;lastMove=performance.now();
    if(!cur.in){cur.in=true;if(op<.05){pos.x=cur.x;pos.y=cur.y;}}
    kick();
  });
  main.addEventListener("pointerleave",function(){cur.in=false;kick();});
  /* la copia scura resta allineata alla chat */
  var thr=main.querySelector(".thread");if(thr)thr.addEventListener("scroll",sync,{passive:true});
  var pend=false;
  new MutationObserver(function(rs){
    if(rs.every(function(r){return under.contains(r.target)||r.target===under;}))return;
    stale=true;if(pend)return;pend=true;
    requestAnimationFrame(function(){pend=false;if(op>.003||cur.in)cloneDark();});
  }).observe(main,{childList:true,subtree:true,characterData:true});
  new MutationObserver(function(){if(S.layer){op=0;apply();}else kick();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-layer"]});
  window.addEventListener("resize",function(){stale=true;});
  apply();
})();

refreshHeader();
startConversation();
updateMode();
probeLocal();
})();
