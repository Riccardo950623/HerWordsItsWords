<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Memoria di Elena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Pantasia';src:url('Pantasia-Regular.woff2') format('woff2');font-weight:400;font-display:swap}

/* Layout: una chat vera a colonna singola. Testata con la persona, cronologia d'archivio sopra la linea "oggi", composer con suggerimenti.
   Chiaro = conversazione. Scuro = layer di authorship (stessa chat, frasi marcate per provenienza). Linguaggio della presentazione: bianco, nero, filetti, serif. */
:root{
  --bg:#FFFFFF; --paper:#F1F1EF; --ink:#0A0A0A;
  --muted:rgba(10,10,10,.52); --line:rgba(10,10,10,.14); --tint:rgba(10,10,10,.045);
  --me:#0A0A0A; --me-ink:#FFFFFF;
  --f:"Times New Roman",Times,serif;
  --ui:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","Neue Haas Grotesk","NHaasGroteskDSPro-65Md","Helvetica Neue",Helvetica,Arial,sans-serif;
  --uifs:12px;
  --fw:400;
  --k:1.14;
  --fs:18px; --lh:1.28;
  color-scheme:light;
}
:root[data-layer="dark"]{
  --f:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","Neue Haas Grotesk","NHaasGroteskDSPro-65Md","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ui:var(--f);
  --fw:500;
  --k:1;
  --bg:#383838; --paper:#434343; --ink:#F8F8F4;
  --muted:rgba(248,248,244,.54); --line:rgba(248,248,244,.22); --tint:rgba(248,248,244,.06);
  --me:transparent; --me-ink:#F8F8F4;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased;transition:background-color .45s,color .45s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ui{font-family:var(--ui);letter-spacing:-.005em}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

.app{position:relative;height:100%;display:flex;overflow:hidden}
.main{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column}
.main{position:relative}
/* foro: il livello scuro affiora sotto la chat bianca dove passa il cursore */
.dkl{
  --f:"Neue Haas Grotesk Display Pro","Neue Haas Grotesk Text Pro","Neue Haas Grotesk","NHaasGroteskDSPro-65Md","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ui:var(--f); --fw:500; --k:1;
  --bg:#383838; --paper:#434343; --ink:#F8F8F4;
  --muted:rgba(248,248,244,.54); --line:rgba(248,248,244,.22); --tint:rgba(248,248,244,.06);
  --me:transparent; --me-ink:#F8F8F4;
  --hx:-999px; --hy:-999px; --hr:85px;
  position:fixed;left:0;top:0;width:0;height:0;z-index:40;display:flex;flex-direction:column;pointer-events:none;visibility:hidden;opacity:0;
  background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.3;
  -webkit-mask-image:radial-gradient(circle var(--hr) at var(--hx) var(--hy),#000 0%,rgba(0,0,0,.9) 18%,rgba(0,0,0,.6) 38%,rgba(0,0,0,.3) 56%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.03) 82%,transparent 90%);
          mask-image:radial-gradient(circle var(--hr) at var(--hx) var(--hy),#000 0%,rgba(0,0,0,.9) 18%,rgba(0,0,0,.6) 38%,rgba(0,0,0,.3) 56%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.03) 82%,transparent 90%)
}
/* sopra, la chat bianca si cancella dentro il foro: niente testi sovrapposti */
.main.holed{
  -webkit-mask-image:radial-gradient(circle var(--hw) at var(--hx) var(--hy),transparent 0%,transparent 46%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.35) 72%,rgba(0,0,0,.68) 86%,#000 100%);
          mask-image:radial-gradient(circle var(--hw) at var(--hx) var(--hy),transparent 0%,transparent 46%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.35) 72%,rgba(0,0,0,.68) 86%,#000 100%)
}
.dkl *{pointer-events:none!important}
.dkl .thread{scroll-behavior:auto!important}
.dkl .msg{animation:none!important}
.dkl .msg.user .bub{border-color:var(--line)}
.dkl .meta{display:flex}
.dkl .msg.user .media{border:1px solid var(--line)}
.dkl .caret{animation:none}
:root[data-layer="dark"] .dkl{display:none}
.col{width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col>.in{margin-inline:clamp(0px,2.4vw,40px)}
:root{--fs:clamp(17px,1.15vw,21px)}

/* testata */
.top{flex:none;border-bottom:1px solid var(--line);background:var(--bg);transition:background-color .45s,border-color .45s;z-index:20}
.top .in{display:flex;align-items:center;gap:14px;height:72px}
.who{display:flex;align-items:center;gap:12px;min-width:0;flex:1;text-align:left;padding:4px 0}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--paper);display:block}
.who .nm{font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .st{font:12px/1.2 var(--ui);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
.sw{display:flex;align-items:center;gap:8px;font:12px/1 var(--ui);text-transform:uppercase;letter-spacing:.04em;flex:none}
.sw .tr{width:36px;height:20px;border:1px solid var(--ink);border-radius:20px;position:relative;transition:background-color .3s}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.sw[aria-checked="true"] .tr::after{transform:translateX(16px)}
.dots{width:36px;height:36px;display:grid;place-items:center;flex:none}
.dots svg{display:block}
.menu{position:absolute;top:66px;right:max(16px,env(safe-area-inset-right,0px));z-index:40;background:var(--bg);border:1px solid var(--ink);min-width:240px;padding:6px;font-family:var(--ui);font-size:14px}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px}
.menu button:hover{background:var(--tint)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* legenda del layer */
.legend{flex:none;border-bottom:1px solid var(--line);font:11.5px/1.3 var(--ui);color:var(--muted)}
.legend .in{display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:9px}
.legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink)}
.legend i.rw{border-top-style:dashed}.legend i.st{border-top-color:var(--muted);border-top-style:dotted}.legend i.cl{border-top:6px solid rgba(248,248,244,.16);height:0}

/* conversazione */
.thread{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain}
.thread .in{padding-block:18px 28px;display:flex;flex-direction:column;gap:4px}
.sep{align-self:center;margin:18px 0 10px;font:11px/1.2 var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;max-width:440px}
.sep b{font-weight:400;color:var(--ink)}
.sep.line{display:flex;align-items:center;gap:12px;align-self:stretch;max-width:none}
.sep.line::before,.sep.line::after{content:"";flex:1;border-top:1px solid var(--line)}
.intro{align-self:center;max-width:460px;text-align:center;font-size:15px;line-height:1.35;color:var(--muted);margin:6px 0 4px;text-wrap:balance}

.msg{display:flex;gap:8px;align-items:flex-end;animation:in .34s cubic-bezier(.2,.8,.2,1) both}
.msg+.msg.cont{margin-top:-1px}
.msg.user{justify-content:flex-end}
.msg .sl{width:34px;flex:none}
.msg .sl img{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;background:var(--paper)}
.stack{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:min(66%,720px)}
.msg.user .stack{align-items:flex-end}
.bub{border-radius:20px;padding:9px 14px 8px;font-size:var(--fs);line-height:var(--lh);overflow-wrap:anywhere;min-width:0;position:relative;transition:background-color .45s,color .45s,border-color .45s}
.msg.bot .bub{background:var(--paper);border-bottom-left-radius:6px}
.msg.user .bub{background:var(--me);color:var(--me-ink);border:1px solid var(--me);border-bottom-right-radius:6px}
:root[data-layer="dark"] .msg.user .bub{border-color:var(--line)}
.bub .tm{float:right;margin:7px 0 -3px 12px;font:10.5px/1 var(--ui);opacity:.55}
.msg.bot.pick .bub{cursor:pointer}
.msg.sel .bub{outline:1px solid var(--ink);outline-offset:2px}
.src{font:11px/1.2 var(--ui);color:var(--muted);padding:2px 6px 0}
.src b{font-weight:400;color:var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* segmenti nel layer */
.seg sup{display:none}
:root[data-layer="dark"] .seg{cursor:pointer;border-radius:4px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
:root[data-layer="dark"] .seg:hover,:root[data-layer="dark"] .seg.on{background:rgba(248,248,244,.18)}
.meta{display:none;align-items:center;gap:10px;font:11px/1.2 var(--ui);color:var(--muted);padding:3px 4px 0}
:root[data-layer="dark"] .meta{display:flex}
.meta button{text-decoration:underline;text-underline-offset:2px;color:var(--ink)}
.bar{display:flex;height:4px;width:80px;flex:none;background:var(--tint);overflow:hidden}
.bar span{display:block;height:100%}
.k-archive{background:var(--ink)}
.k-reworked{background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px)}
.k-style{background:var(--muted)}
.k-claim{background:rgba(127,127,120,.35)}

/* media */
.media{border-radius:20px;overflow:hidden;background:var(--paper);width:440px;max-width:100%;min-width:0;transition:background-color .45s}
.msg.bot .media{border-bottom-left-radius:6px}
.ph{position:relative;display:block;width:100%;aspect-ratio:4/3;max-width:100%;background:var(--tint)}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph.kb img{transform-origin:50% 40%;transition:transform .6s ease}
.ph.kb.playing img{transform:scale(1.14);transition:transform var(--kbd,20s) linear}
.ph .tag{position:absolute;left:10px;bottom:9px;font:10.5px/1 var(--ui);color:#FFFFFF;background:rgba(10,10,10,.55);padding:4px 7px}
.ph .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(10,10,10,.6);color:#FFFFFF;display:grid;place-items:center}
.ph .sub{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;background:linear-gradient(transparent,rgba(10,10,10,.78));color:#FFFFFF;font-size:15px;line-height:1.3}
.ph .prog{position:absolute;left:0;bottom:0;height:3px;background:#FFFFFF;width:0}
.cap{padding:9px 14px 10px;font-size:15px;line-height:1.3}
.cap small{display:block;font:11px/1.25 var(--ui);color:var(--muted);margin-top:4px}
.vn{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.vn .pb{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.wv{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:30px}
.wv i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:var(--muted);transition:background-color .15s}
.wv i.on{background:var(--ink)}
.vn small{font:11px/1 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:30px;text-align:right}
.tx{padding:0 14px 10px;font-size:14.5px;line-height:1.35;color:var(--muted)}
.tx .w.on{color:var(--ink)}
.tx-t{font:11px/1 var(--ui);color:var(--muted);text-decoration:underline;text-underline-offset:2px;margin:0 14px 10px}
.msg.user .media{background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
.msg.user .media .wv i{background:currentColor;opacity:.5}
.msg.user .media .vn .pb{background:var(--me-ink);color:var(--ink)}
:root[data-layer="dark"] .msg.user .media{border:1px solid var(--line)}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* composer */
.foot{flex:none;border-top:1px solid var(--line);background:var(--bg);padding-bottom:max(10px,env(safe-area-inset-bottom,0px));transition:background-color .45s,border-color .45s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font:13px/1.1 var(--ui);white-space:nowrap;transition:border-color .2s,background-color .2s}
.chip:hover{border-color:var(--ink)}
.chip.next{border-color:var(--ink)}
.prev{display:flex;align-items:center;gap:10px;margin-top:8px;font:12px/1.2 var(--ui);color:var(--muted)}
.prev img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.prev button{text-decoration:underline}
.comp{display:flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 6px;transition:border-color .2s}
.comp:focus-within{border-color:var(--ink)}
.comp input[type=text]{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;padding:8px 4px}
.comp input::placeholder{color:var(--muted)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)}
.ib:hover{color:var(--ink)}
.go{background:var(--ink);color:var(--bg)}
.go:hover{color:var(--bg);opacity:.85}
.go:disabled{opacity:.3;cursor:default}

/* pannello laterale: metà schermo */
.side{flex:0 0 0;width:0;min-width:0;height:100%;overflow:hidden;background:var(--bg);border-left:1px solid transparent;transition:flex-basis .38s cubic-bezier(.3,.9,.3,1),border-color .38s,background-color .45s}
.app.open .side{flex-basis:50%;border-left-color:var(--line)}
.side-in{width:50vw;height:100%;display:flex;flex-direction:column}
.side-head{flex:none;display:flex;justify-content:space-between;align-items:center;height:72px;padding:0 max(28px,env(safe-area-inset-right,0px)) 0 32px;border-bottom:1px solid var(--line)}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:28px max(28px,env(safe-area-inset-right,0px)) 48px 32px}
@media(max-width:820px){
  .side{position:absolute;inset:0;z-index:30;flex:none;width:100%;transform:translateX(100%);visibility:hidden;transition:transform .34s cubic-bezier(.3,.9,.3,1),visibility 0s .34s}
  .app.open .side{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.3,.9,.3,1),visibility 0s}
  .side-in{width:100%}
  .side-head{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .side-body{padding:22px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
}
.back{font-family:var(--ui);font-weight:700;font-stretch:condensed;letter-spacing:-.02em;text-transform:uppercase;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;font-size:13px;line-height:1}
.lab{font:11px/1.2 var(--ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
.big{display:flex;gap:36px;margin:30px 0 18px}
.big b{display:block;font-size:56px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.big span{font:11px/1.2 var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.big .g b{color:var(--muted)}
.side .bar{width:100%;height:6px}
.rows{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:9px}
.rows li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;font:13px/1.25 var(--ui)}
.rows i{width:12px;height:12px;margin-top:1px;display:block}
.rows small{display:block;color:var(--muted);font-size:11.5px}
.rows b{font-weight:400;font-variant-numeric:tabular-nums}
.side h3{margin:30px 0 12px}
.sc{border-left:1px solid var(--ink);padding:4px 0 4px 14px;margin:0 0 16px}
.sc.reworked{border-left-style:dashed}.sc.style{border-left-style:dotted;border-left-color:var(--muted)}.sc.claim{border-left-width:4px;border-left-color:rgba(127,127,120,.45)}
.sc .q{margin:5px 0 0;font-size:17px;line-height:1.3}
.sc .n{margin:6px 0 0;font:12px/1.35 var(--ui);color:var(--muted)}
.frag{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.frag p{margin:4px 0 0;font-size:14px;line-height:1.35;color:var(--muted)}
mark{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.fine{margin:22px 0 0;font:11.5px/1.4 var(--ui);color:var(--muted)}

/* profilo */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end}
.hero .pic{position:relative}
.hero .pic img{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block;background:var(--paper)}
.hero .pic button{position:absolute;right:-4px;bottom:4px;background:var(--bg);border:1px solid var(--ink);border-radius:999px;font:11px/1 var(--ui);padding:6px 9px}
.hero h2{margin:0;font-size:40px;font-weight:400;line-height:1;text-wrap:balance}
.hero p{margin:8px 0 0;font:13px/1.35 var(--ui);color:var(--muted)}
.counts{display:flex;gap:22px;margin-top:14px;font:12px/1.2 var(--ui)}
.counts b{display:block;font:400 24px/1 var(--f);margin-bottom:3px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:30px 0 20px;overflow-x:auto}
.tabs button{font:13px/1 var(--ui);padding:12px 0;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:6px}
.tile{position:relative;aspect-ratio:1;max-width:100%;background:var(--paper);overflow:hidden;text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile .tl{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;background:linear-gradient(transparent,rgba(10,10,10,.7));color:#FFFFFF;font:11px/1.25 var(--ui)}
.tile .ty{position:absolute;top:8px;left:8px;font:10px/1 var(--ui);text-transform:uppercase;letter-spacing:.05em;background:rgba(10,10,10,.55);color:#FFFFFF;padding:4px 6px}
.tile.aud{display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.tile.aud .wv{flex:none;height:56px}
.tile.aud .tl{position:static;background:none;color:var(--ink);padding:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:12.5px/1 var(--ui)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:0}
.it{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.it .id{font:11px/1.4 var(--ui);color:var(--muted)}
.it .id b{display:block;color:var(--ink);font-weight:400}
.it h4{margin:0;font-size:18px;font-weight:400;line-height:1.2}
.it p{margin:4px 0 0;font-size:15px;line-height:1.35;color:var(--muted)}
.it .u{display:inline-block;margin-top:6px;font:11px/1 var(--ui);border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px 40px}
.two h3{margin:0 0 10px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:16px}
dt{font:12px/1.5 var(--ui);color:var(--muted)}dd{margin:0}

pendere in ufficio"], ["2024-12-02 19:30", "E", "Matteo, non voglio che ti preoccupi più di quanto serve. Lavora, vivi, porta Chiara al mare. Io qui ho papà, le ortensie e tua sorella che chiama dieci volte al giorno."], ["2025-01-20 12:00", "E", "Mi ha detto Chiara che le hai chiesto di venire a vivere con te. Bravo. Era ora."], ["2025-01-20 12:30", "M", "Ma come fai a sapere sempre tutto"], ["2025-01-20 12:31", "E", "Sono tua madre. È il mio lavoro."]]}, {"id": "R", "con": "Rosanna", "titolo": "Rosi", "messaggi": [["2021-08-03 21:30", "R", "Lella quest’anno Cervia sì o no? Ho bisogno di sapere se compro il costume nuovo"], ["2021-08-03 21:32", "E", "Sì, sempre sì. Il costume compralo, che quello dell’anno scorso l’hai sfondato sul pedalò."], ["2022-08-12 20:00", "E", "Rosi, stasera da Mario ho preso pistacchio e amarena. Ti ho pensata, che tu prendi sempre fiordilatte come una bambina."], ["2022-08-12 20:05", "R", "Il fiordilatte è un classico. Voi siete delle snob del gelato"], ["2023-01-14 22:45", "E", "Ho finito il giallo che mi hai prestato. L’assassino l’avevo capito a pagina trenta. Mandamene uno più difficile."], ["2023-01-14 22:50", "R", "Sei impossibile. Ti porto Simenon"], ["2023-03-30 18:20", "E", "Giulia oggi ha trentacinque anni. Ti ricordi quando l’abbiamo portata a Cervia la prima volta e ha mangiato la sabbia?"], ["2023-03-30 18:25", "R", "Come se fosse ieri. E tu che piangevi perché pensavi si strozzasse"], ["2023-09-10 10:00", "E", "Domenica vieni a pranzo? Faccio la torta fritta, Paolo ha già comprato il culatello."], ["2023-09-10 10:05", "R", "Arrivo affamata alle 12:30"], ["2023-12-30 21:00", "E", "Stasera Mina in tv e io col plaid. Se mi chiami disturbi."], ["2024-02-12 22:10", "E", "Rosi, ho smesso di dire sto bene quando non è vero. Mi sono accorta che alla nostra età le bugie piccole pesano di più."], ["2024-02-12 22:20", "R", "Brava Lella. E io ho smesso di dire che ho 55 anni"], ["2024-02-12 22:21", "E", "Era ora, ne hai sessanta da novembre."], ["2024-08-02 19:00", "E", "Rosi, quest’anno a Cervia la facciamo senza ombrellone fisso, che il bagnino mi ha rubato il posto vicino alla pineta. Ma il gelato da Mario non me lo toglie nessuno."], ["2024-08-10 18:00", "R", "Mi hai detto che sono abbronzata come una pesca ma sei tu la pesca"], ["2024-08-10 18:02", "E", "Due pesche mature, ecco cosa siamo. Domani ultimo bagno e poi a casa."], ["2024-11-25 21:00", "E", "Rosi, non chiamarmi per chiedermi degli esami. Chiamami per raccontarmi del tuo vicino che parcheggia male. Di quello ho bisogno."], ["2024-11-25 21:05", "R", "Allora ascolta: oggi l’ha messa di traverso sul marciapiede"], ["2024-11-25 21:06", "E", "Ecco. Continua, ti prego."], ["2025-01-08 16:00", "E", "Ho trovato una foto nostra del 1990, sul mare, tu con quel costume a righe. Te la faccio vedere quando vieni. Eravamo belle e non lo sapevamo."], ["2025-02-20 20:30", "E", "Promettimi che ad agosto vai a Cervia lo stesso. E prendi un pistacchio per me, anche se ti fa schifo."], ["2025-02-20 20:40", "R", "Te lo prometto Lella"]]}, {"id": "P", "con": "Paolo", "titolo": "Paolo", "messaggi": [["2022-04-09 11:00", "E", "Al mercato hanno i carciofi buoni. Ne prendo sei. Tu compra il pane, quello col sesamo."], ["2022-04-09 11:02", "P", "Ok. Sesamo"], ["2022-11-03 17:30", "E", "Hai chiamato l’idraulico? Il rubinetto del bagno fa ancora la sua musica."], ["2022-11-03 18:45", "P", "Domani"], ["2022-11-03 18:46", "E", "Domani è una parola che usi da settembre."], ["2023-06-22 07:00", "E", "Trentotto anni. Mi hai pestato i piedi al primo ballo e da allora non hai più smesso di camminarmi accanto. Buon anniversario."], ["2023-06-22 07:30", "P", "Buon anniversario. Ti ho comprato le rose ma sono in macchina e si sono un po’ piegate"], ["2023-06-22 07:31", "E", "Piegate vanno benissimo. Anche noi siamo un po’ piegati."], ["2024-05-19 10:00", "E", "Il rubinetto del bagno gocciola ancora. Non è un’emergenza, è una promessa che mi hai fatto a Pasqua."], ["2024-09-15 18:20", "E", "Sono al Parco Ducale con Sofia, ha raccolto solo foglie gialle e non vuole tornare. Ritardo di mezz’ora, metti su l’acqua per la pasta."], ["2024-12-10 15:00", "E", "Ricordati di ritirare le analisi in farmacia. E compra il panettone per tua sorella, che quest’anno non me lo dimentico."], ["2025-01-27 22:30", "E", "Sei in salotto e io in camera, ma ti scrivo lo stesso: grazie per oggi. Per il tè, per la coperta, per non avermi chiesto niente."], ["2025-01-27 22:31", "P", "Arrivo"], ["2025-03-01 09:00", "E", "Nel cassetto di sinistra c’è tutto quello che ti serve. Te l’ho scritto anche nella mail, così non hai scuse."]]}, {"id": "F", "con": "Famiglia", "titolo": "Famiglia ❤️", "messaggi": [["2022-12-24 09:00", "E", "Il ragù è sul fuoco dalle sette. Domani all’una puntuali. Chi arriva tardi lava i piatti."], ["2022-12-24 09:05", "M", "Arrivo alle 12:59"], ["2022-12-24 09:06", "G", "Noi alle 12:30 così Sofia gioca con l’albero"], ["2022-12-24 09:07", "E", "L’albero sopravvive a tutto, tranquilli. Le palline rotte stanno dietro."], ["2023-04-09 20:00", "E", "Buona Pasqua a tutti. Uova di cioccolato finite in un’ora, record di Sofia."], ["2023-08-15 13:00", "E", "Ferragosto sul Po come una volta: papà ha portato il cocomero da mettere in acqua. Mancate solo voi."], ["2023-11-11 21:30", "E", "Buonanotte famiglia. Domani pioggia, coprite le piante e voi stessi."], ["2024-03-14 20:00", "E", "Grazie per gli auguri. Sessantun anni e una torta fatta da Sofia con le dita. La più buona della mia vita."], ["2024-06-08 12:00", "E", "Da oggi sono ufficialmente pensionata. Accetto inviti a pranzo, lezioni di burraco e nipoti da tenere."], ["2024-06-08 12:10", "G", "Sofia si prenota per tutti i mercoledì"], ["2024-06-08 12:11", "E", "Mercoledì è suo. Scritto a penna."], ["2024-12-25 23:00", "E", "Grazie a tutti per oggi. Il ragù è finito, la casa è piena di carte da regalo e io sono contenta. Buonanotte."], ["2024-12-31 23:55", "E", "Auguri a tutti. Che il nuovo anno vi trovi con le scarpe comode e il frigo pieno. Il resto si aggiusta."], ["2025-02-09 21:00", "E", "Domenica prossima tortelli. Chi li vuole alzi la mano. Lo so che siete tutti, chiedo per educazione."], ["2025-03-02 21:30", "E", "Buonanotte a tutti. Vi voglio bene, anche quando non lo dico. Soprattutto allora."]]}], "scritti": [{"id": "E01", "tipo": "mail", "data": "2019-11-04", "a": "Annamaria", "titolo": "La Singer della mamma", "testo": "Anna, ho fatto riparare la Singer della mamma da un signore di via Bixio che ha novant’anni e le mani ferme come un chirurgo. Funziona. L’ho messa nella stanza degli ospiti. Quando vieni proviamo a cucire qualcosa insieme, anche solo un orlo. Mi sembra il modo giusto di ricordarla."}, {"id": "E02", "tipo": "mail", "data": "2020-04-20", "a": "Colleghe", "titolo": "Lezioni a distanza", "testo": "Care colleghe, vi scrivo dal tavolo della cucina, con il computer appoggiato su due dizionari. Oggi Tommaso mi ha mostrato il suo criceto per venti minuti e abbiamo fatto scienze così. Non so se stiamo facendo bene, ma stiamo facendo. Ricordiamoci di chiedere ai bambini come stanno prima di chiedere i compiti."}, {"id": "E03", "tipo": "mail", "data": "2021-06-21", "a": "Paolo", "titolo": "Trentasei anni", "testo": "Paolo, domani sono trentasei anni. Ti scrivo una cosa che non ti dico mai: quando torno a casa e sento la radio accesa in garage, so che va tutto bene. È una cosa piccola. Ma la vita è fatta di cose piccole che durano."}, {"id": "E04", "tipo": "mail", "data": "2022-09-26", "a": "Matteo", "titolo": "Il primo stipendio", "testo": "Caro Matteo, il primo stipendio non spenderlo tutto in cose inutili. Spendine metà in cose inutili, che a ventisette anni ci vogliono, e metti da parte l’altra metà. E compra un regalo a tuo padre, anche piccolo: non lo dirà, ma ci tiene."}, {"id": "E05", "tipo": "mail", "data": "2023-11-15", "a": "Rosanna", "titolo": "Sessant’anni di Rosi", "testo": "Rosi, sessant’anni. Ti ho conosciuta che ne avevi quattordici e mi copiavi il latino. Da allora mi hai copiato anche il taglio di capelli, la ricetta della torta fritta e l’idea di sposarsi a giugno. Io ti ho copiato la risata. Mi sembra uno scambio giusto. Auguri, amica mia."}, {"id": "E06", "tipo": "mail", "data": "2024-05-30", "a": "Dirigente scolastica", "titolo": "Saluto alla scuola", "testo": "Gentile dirigente, a fine giugno lascio la scuola dopo trentasette anni. Vorrei ringraziare i bidelli, che mi hanno aperto il cancello ogni volta che dimenticavo le chiavi, e le colleghe, che mi hanno sopportata. Lascio nella stanza delle maestre il mio armadietto pieno di colle, gessi e cartelloni: chi ne ha bisogno prenda pure."}, {"id": "E07", "tipo": "mail", "data": "2024-10-14", "a": "Giulia", "titolo": "Il lavoro e la bambina", "testo": "Giulia, ho capito dalla voce che sei stanca. Non devi essere la migliore avvocata di Milano e la migliore mamma di Milano nello stesso giorno. Un giorno vince il lavoro, un giorno vince Sofia, e va bene così. Io per anni ho corretto i compiti con te attaccata al collo, e siamo vive tutte e due."}, {"id": "E08", "tipo": "mail", "data": "2025-03-02", "a": "Paolo", "titolo": "Istruzioni di casa", "testo": "Paolo, la cassetta degli attrezzi, il libretto della macchina e la password del wifi sono nel cassetto di sinistra. La password è il nome di Briciola con la data in cui ci siamo sposati. Le ortensie vanno potate a marzo, non prima. E il rubinetto del bagno, ti prego, fallo sistemare."}, {"id": "D01", "tipo": "diario", "data": "2019-03-14", "a": "", "titolo": "Cinquantasei", "testo": "Cinquantasei anni. Paolo mi ha regalato un vaso per le ortensie e un biglietto con scritto per la mia ortensia preferita. Dopo trentaquattro anni di matrimonio ancora non sa scrivere i biglietti, e io ancora li conservo tutti."}, {"id": "D02", "tipo": "diario", "data": "2020-11-02", "a": "", "titolo": "Il giorno dei morti", "testo": "Al cimitero della Villetta con Anna. Abbiamo portato i crisantemi alla mamma e al papà. Anna ha detto che la mamma odiava i crisantemi. Abbiamo riso come due sceme davanti alla tomba. Credo che la mamma avrebbe riso anche lei."}, {"id": "D03", "tipo": "diario", "data": "2021-10-03", "a": "", "titolo": "Sofia ha due settimane", "testo": "Sofia ha due settimane e una faccia da vecchia saggia. Giulia è stanca e bellissima. Davide non sa ancora tenerla in braccio senza sembrare che stia trasportando un vaso di cristallo. Io la terrei sempre io, ma non è il mio turno, e devo imparare."}, {"id": "D04", "tipo": "diario", "data": "2022-02-20", "a": "", "titolo": "La neve", "testo": "Stamattina un po’ di neve sul giardino. Ho fatto un pupazzo di neve piccolissimo sul davanzale e l’ho fotografato per mandarlo a Sofia. Paolo dice che sono peggio di una bambina. Non ha torto."}, {"id": "D05", "tipo": "diario", "data": "2023-04-25", "a": "", "titolo": "La festa della Liberazione", "testo": "Il papà il 25 aprile metteva il vestito buono e andava in piazza senza dire niente. Io da bambina non capivo. Oggi ci sono andata anch’io, da sola, e sono stata in silenzio come lui. Certe cose non si spiegano, si fanno."}, {"id": "D06", "tipo": "diario", "data": "2023-10-15", "a": "", "titolo": "L’autunno nell’orto", "testo": "Ho tolto le piante di pomodoro. Ogni anno mi dispiace come se salutassi qualcuno. Ho messo le cipolle e l’aglio per la primavera. L’orto mi insegna che si finisce e si ricomincia, e che non serve fare un dramma."}, {"id": "D07", "tipo": "diario", "data": "2024-06-28", "a": "", "titolo": "Primo giorno di pensione", "testo": "Primo vero giorno di pensione. Mi sono svegliata alle sei e mezza lo stesso. Ho fatto il caffè, ho guardato il giardino, ho aspettato una campanella che non è suonata. Poi ho fatto una torta senza motivo. Forse la pensione è questo: fare le cose senza motivo."}, {"id": "D08", "tipo": "diario", "data": "2024-11-20", "a": "", "titolo": "Dopo l’ospedale", "testo": "Oggi non scrivo dei medici. Scrivo che il giardino era pieno di foglie gialle e che Paolo le ha raccolte tutte in un mucchio perché sa che mi piace guardarlo. Mi tengo questo."}, {"id": "D09", "tipo": "diario", "data": "2025-02-01", "a": "", "titolo": "Le lettere", "testo": "Ho cominciato a scrivere lettere a tutti. Mi viene facile, ho passato la vita a scrivere sui quaderni degli altri. La più difficile è quella per Sofia, perché non so che donna sarà. So solo che sarà testarda come sua madre e come me."}, {"id": "D10", "tipo": "diario", "data": "2025-02-25", "a": "", "titolo": "Il sole sul tavolo", "testo": "Stamattina il sole entrava sul tavolo della cucina e illuminava il quaderno della mamma. Sono rimasta a guardarlo per un’ora. Non ho fatto niente di utile e sono stata felice."}], "selfie": [{"id": "SE01", "descrizione": "in cucina col caffè della moka", "luogo": "cucina", "momento": "mattina", "stagione": "sempre", "media": "media/SE01.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: holding a small cup of espresso next to a stovetop moka pot, morning light from the window, still in a soft cardigan. Photorealistic, ordinary everyday photo, not posed, no filters, no text. Vertical 3:4."}, {"id": "SE02", "descrizione": "al mercato della Ghiaia con la borsa della spesa", "luogo": "mercato della Ghiaia, Parma", "momento": "mattina", "stagione": "sempre", "media": "media/SE02.jpg", "prompt": "Same woman as the attached photo (Elena, 61), exactly the same face, glasses and hair. A casual front-camera smartphone SELFIE she takes herself, arm slightly visible, face filling a good part of the frame, natural unflattering phone angle, a bit of motion softness. Scene: outdoor market stalls with vegetables behind her, a cloth shopping bag with leeks on her shoulder. Photorealistic, ordin
